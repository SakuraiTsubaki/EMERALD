name: Future Generation Capacity

on:
  push:
    branches: [main]
    paths:
      - "patches/pokeemerald-expansion/**"
      - "manifests/engine-base.yml"
      - "manifests/future-generation-readiness.yml"
      - "manifests/emerald-binary-baseline.csv"
      - "manifests/pkhex-source-pin.yml"
      - "research/rom-save-expansion-baseline.md"
      - "tools/analyze_emerald_binary_set.py"
      - "tools/reference_pins.py"
      - "tools/prepare_expanded_profile.py"
      - "tools/verify_future_generation_readiness.py"
      - "tools/pkhex_reference_export.py"
      - "tools/pkhex_reference_extract.py"
      - ".github/workflows/future-generation-readiness.yml"
  pull_request:
    paths:
      - "patches/pokeemerald-expansion/**"
      - "manifests/engine-base.yml"
      - "manifests/future-generation-readiness.yml"
      - "manifests/emerald-binary-baseline.csv"
      - "manifests/pkhex-source-pin.yml"
      - "research/rom-save-expansion-baseline.md"
      - "tools/analyze_emerald_binary_set.py"
      - "tools/reference_pins.py"
      - "tools/prepare_expanded_profile.py"
      - "tools/verify_future_generation_readiness.py"
      - "tools/pkhex_reference_export.py"
      - "tools/pkhex_reference_extract.py"
      - ".github/workflows/future-generation-readiness.yml"
  workflow_dispatch:

jobs:
  verify-capacity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EMERALD
        uses: actions/checkout@v4
        with:
          path: emerald

      - name: Check out pinned pokeemerald-expansion
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: 75b806a3ab57a81ff1eb6179288981f0b3cc3050
          path: expansion

      - name: Apply EMERALD expansion patches
        run: |
          for patch in emerald/patches/pokeemerald-expansion/*.patch; do
            git -C expansion apply --check "../$patch"
            git -C expansion apply "../$patch"
          done
          git -C expansion diff --check

      - name: Verify future-generation capacity
        run: python emerald/tools/verify_future_generation_readiness.py expansion

      - name: Compile helper scripts
        run: |
          python -m py_compile             emerald/tools/analyze_emerald_binary_set.py             emerald/tools/reference_pins.py             emerald/tools/prepare_expanded_profile.py             emerald/tools/verify_future_generation_readiness.py             emerald/tools/pkhex_reference_export.py             emerald/tools/pkhex_reference_extract.py

      - name: Re-check existing regional profile
        run: python emerald/tools/verify_regional_forms.py expansion
