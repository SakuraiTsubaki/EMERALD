name: mGBA smoke test

on:
  push:
    branches: [main]
    paths:
      - "patches/pokeemerald/**"
      - ".github/workflows/mgba-smoke.yml"
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout EMERALD
        uses: actions/checkout@v4

      - name: Install build and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            mgba-sdl \
            xvfb \
            imagemagick \
            git \
            make
          mgba --version || true
          arm-none-eabi-gcc --version | head -1

      - name: Checkout reference pokeemerald
        run: |
          git clone --depth 1 https://github.com/pret/pokeemerald.git pokeemerald
          cd pokeemerald
          git fetch --depth 1 origin 5eff78649e7170a877b961ef0b3da13b81a16038
          git checkout 5eff78649e7170a877b961ef0b3da13b81a16038

      - name: Apply EMERALD patches
        run: |
          cd pokeemerald
          git apply ../patches/pokeemerald/0001-always-available-core-external-events.patch
          git apply ../patches/pokeemerald/0002-littleroot-event-ticket-npc.patch
          git diff --check
          git status --short

      - name: Build patched ROM with modern toolchain
        run: |
          cd pokeemerald
          make -j2 modern
          test -s pokeemerald_modern.gba
          sha256sum pokeemerald_modern.gba

      - name: Boot patched ROM in mGBA
        shell: bash
        run: |
          cd pokeemerald
          rm -f ../mgba.log
          set +e
          timeout 12s xvfb-run -a mgba pokeemerald_modern.gba >../mgba.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            cat ../mgba.log
            exit "$code"
          fi
          echo "mGBA boot smoke passed (exit=$code)" | tee -a ../mgba.log
          tail -100 ../mgba.log || true

      - name: Upload mGBA verification
        uses: actions/upload-artifact@v4
        with:
          name: mgba-smoke
          path: mgba.log
          if-no-files-found: error
