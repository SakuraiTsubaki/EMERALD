name: Regional Forms Expanded Profile

on:
  push:
    branches:
      - feature/regional-forms-all
  pull_request:
  workflow_dispatch:

jobs:
  verify-regional-forms:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EMERALD
        uses: actions/checkout@v4
        with:
          path: emerald

      - name: Check out pinned pokeemerald-expansion
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: 75b806a3ab57a81ff1eb6179288981f0b3cc3050
          path: expansion

      - name: Check regional overlay patch
        run: git -C expansion apply --check ../emerald/patches/pokeemerald-expansion/0001-lock-regional-forms-profile.patch

      - name: Apply regional overlay patch
        run: git -C expansion apply ../emerald/patches/pokeemerald-expansion/0001-lock-regional-forms-profile.patch

      - name: Verify regional roster and symbols
        run: python emerald/tools/verify_regional_forms.py expansion
