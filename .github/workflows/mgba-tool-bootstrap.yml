name: mGBA tool bootstrap

on:
  push:
    branches:
      - feature/aegislash-gen6
    paths:
      - .github/workflows/mgba-tool-bootstrap.yml

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Download missing runtime dependency
        run: |
          set -eux
          sudo apt-get update
          apt-get download libxcb-cursor0
          ls -lh *.deb
      - name: Upload dependency
        uses: actions/upload-artifact@v4
        with:
          name: mgba-xcb-cursor
          path: '*.deb'
          retention-days: 1
