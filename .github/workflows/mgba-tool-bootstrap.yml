name: mGBA tool bootstrap

on:
  push:
    branches:
      - feature/aegislash-gen6
    paths:
      - .github/workflows/mgba-tool-bootstrap.yml

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Download mGBA AppImage
        run: |
          set -eux
          curl -L --fail --retry 3 -o mGBA.AppImage https://s3.amazonaws.com/mgba/mGBA-build-latest-appimage-x64.appimage
          chmod +x mGBA.AppImage
          ./mGBA.AppImage --appimage-extract
          find squashfs-root -maxdepth 3 -type f -print
      - name: Upload extracted mGBA
        uses: actions/upload-artifact@v4
        with:
          name: mgba-appimage-extracted
          path: squashfs-root
          retention-days: 1
