name: mGBA tool bootstrap

on:
  push:
    branches:
      - feature/aegislash-gen6
    paths:
      - .github/workflows/mgba-tool-bootstrap.yml

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Download mGBA nightly packages
        run: |
          set -eux
          curl -L --fail --retry 3 -o mgba.tar.xz https://s3.amazonaws.com/mgba/mGBA-build-latest-ubuntu64-noble.tar.xz
          mkdir pkgs
          tar -xJf mgba.tar.xz -C pkgs
          find pkgs -name '*.deb' -print
      - name: Install headless package and dependencies
        run: |
          set -eux
          LIB=$(find pkgs -name 'libmgba.deb' | head -1)
          HEAD=$(find pkgs -name 'mgba-headless.deb' | head -1)
          sudo apt-get update
          sudo apt-get install -y "./$LIB" "./$HEAD"
          test -x /usr/bin/mgba-headless
          ldd /usr/bin/mgba-headless
      - name: Bundle binary and all linked libraries
        run: |
          set -eux
          mkdir -p bundle/bin bundle/lib
          cp /usr/bin/mgba-headless bundle/bin/
          ldd /usr/bin/mgba-headless | tee bundle/ldd.txt
          ldd /usr/bin/mgba-headless | awk '/=> \/|^\// { for (i=1;i<=NF;i++) if ($i ~ /^\//) print $i }' | sort -u > bundle/libs.txt
          while read -r lib; do cp -L "$lib" bundle/lib/; done < bundle/libs.txt
          cp -L /lib64/ld-linux-x86-64.so.2 bundle/lib/ || true
          find bundle -maxdepth 2 -type f -print
      - name: Upload self-contained mGBA headless
        uses: actions/upload-artifact@v4
        with:
          name: mgba-headless-portable
          path: bundle
          retention-days: 1
