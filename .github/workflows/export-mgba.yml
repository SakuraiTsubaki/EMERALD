name: Export mGBA Linux

on:
  push:
    branches:
      - feature/arceus-all-gen
    paths:
      - .github/workflows/export-mgba.yml
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Download mGBA AppImage
        run: |
          curl -L --fail --retry 3             -o mGBA-0.10.5-appimage-x64.appimage             https://github.com/mgba-emu/mgba/releases/download/0.10.5/mGBA-0.10.5-appimage-x64.appimage
          chmod +x mGBA-0.10.5-appimage-x64.appimage
          sha256sum mGBA-0.10.5-appimage-x64.appimage > SHA256SUMS.txt
      - name: Upload mGBA
        uses: actions/upload-artifact@v4
        with:
          name: mgba-linux-appimage
          path: |
            mGBA-0.10.5-appimage-x64.appimage
            SHA256SUMS.txt
          if-no-files-found: error
