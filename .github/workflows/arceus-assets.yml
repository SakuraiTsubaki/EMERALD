name: Build Arceus graphics assets

on:
  push:
    branches:
      - feature/arceus-all-gen
    paths:
      - artifacts/graphics/arceus/source/**
      - tools/build_arceus_assets.py
      - .github/workflows/arceus-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/arceus-all-gen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build Arceus assets
        run: python tools/build_arceus_assets.py

      - name: Commit generated assets
        shell: bash
        run: |
          git add artifacts/graphics/arceus/generated
          if git diff --cached --quiet; then
            echo "Generated assets already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build Arceus graphics artifacts"
          git push origin HEAD:feature/arceus-all-gen
