schema: 1
project: EMERALD
policy:
  goal: "Make all external-distribution and external-device event content permanently accessible in-game."
  preserve_one_time_completion: true
  require_external_hardware: false
  require_external_distribution: false
  rom_binaries_in_repository: false
  ticket_policy: "A new permanent NPC in Littleroot Town distributes the original ticket items; do not bypass the original destination logic."
  language_priority:
    - ja
    - ko
    - en
    - de
    - fr
    - it
    - es

ticket_provider:
  map: MAP_LITTLEROOT_TOWN
  script: LittlerootTown_EventScript_EventTicketCourier
  graphics: OBJ_EVENT_GFX_MYSTERY_GIFT_MAN
  always_present: true
  menu_choices:
    - ITEM_EON_TICKET
    - ITEM_AURORA_TICKET
    - ITEM_MYSTIC_TICKET
    - ITEM_OLD_SEA_MAP
  delivery_mode: one_selected_item_per_interaction
  can_cancel_with_b: true
  story_state_dependency: false

reference:
  repository: pret/pokeemerald
  commit: 5eff78649e7170a877b961ef0b3da13b81a16038

events:
  - id: southern_island
    source_gate:
      item: ITEM_EON_TICKET
      flag: FLAG_ENABLE_SHIP_SOUTHERN_ISLAND
      original_external_path: Record Mixing / Eon Ticket
    content: Latios/Latias event
    policy: distribute_ticket_preserve_original_travel_logic
    status: littleroot_ticket_npc_patch_0002

  - id: birth_island
    source_gate:
      item: ITEM_AURORA_TICKET
      flag: FLAG_ENABLE_SHIP_BIRTH_ISLAND
      original_external_path: Mystery Gift / Aurora Ticket
    content: Deoxys event
    policy: distribute_ticket_preserve_original_travel_logic
    status: littleroot_ticket_npc_patch_0002

  - id: navel_rock
    source_gate:
      item: ITEM_MYSTIC_TICKET
      flag: FLAG_ENABLE_SHIP_NAVEL_ROCK
      original_external_path: Mystery Gift / Mystic Ticket
    content: Lugia and Ho-Oh event
    policy: distribute_ticket_preserve_original_travel_logic
    status: littleroot_ticket_npc_patch_0002

  - id: faraway_island
    source_gate:
      item: ITEM_OLD_SEA_MAP
      flag: FLAG_ENABLE_SHIP_FARAWAY_ISLAND
      original_external_path: Mystery Gift / Old Sea Map
    content: Mew event
    policy: distribute_ticket_preserve_original_travel_logic
    status: littleroot_ticket_npc_patch_0002

  - id: altering_cave
    source_gate:
      var: VAR_ALTERING_CAVE_WILD_SET
      original_external_path: Mystery Gift
    content: all Altering Cave encounter tables
    policy: all_tables_permanently_available
    status: core_patch_0001

  - id: mystery_gift_system
    source_gate:
      flag: FLAG_SYS_MYSTERY_GIFT_ENABLE
      external_path: Wireless Adapter / Wonder Card
    policy: internalize
    status: queued

  - id: mystery_event_system
    source_gate:
      flag: FLAG_SYS_MYSTERY_EVENT_ENABLE
      external_path: e-Reader / Mystery Event
    policy: internalize
    status: queued

  - id: surf_pichu
    source_script: data/scripts/gift_pichu.inc
    external_path: Mystery Gift RAM script
    policy: expose_in_game_preserve_once_only
    status: queued

  - id: battle_count_card
    source_script: data/scripts/gift_battle_card.inc
    external_path: Wonder Card
    policy: expose_in_game
    status: queued

  - id: stamp_card
    source_script: data/scripts/gift_stamp_card.inc
    external_path: Wonder Card
    policy: expose_in_game
    status: queued

  - id: visiting_trainer
    source_script: data/scripts/gift_trainer.inc
    source_maps:
      - data/maps/SootopolisCity_MysteryEventsHouse_1F
      - data/maps/SootopolisCity_MysteryEventsHouse_B1F
    external_path: e-Reader / Wonder Card trainer data
    policy: embed_data_and_expose_in_game
    status: queued

  - id: trainer_hill_ereader
    source: src/trainer_hill.c
    external_path: e-Reader Trainer cards
    payload_scope:
      main_trainer_cards: 64
      main_cards_already_embedded_in_localized_modes: 32
      main_cards_still_external: 32
      promotional_trainer_cards_still_external: 2
      total_external_payloads_remaining: 34
      non_data_map_puzzle_cards: 19
    embedded_card_ranges:
      normal: 19-A017..19-A024
      variety: 19-A041..19-A048
      unique: 19-A049..19-A056
      expert: 19-A057..19-A064
    identity_manifest: manifests/battle-e-emerald-cards.csv
    extraction_tool: tools/trainer_hill_sector.py
    policy: embed_all_available_card_data
    status: 32_embedded_34_external_payloads_remaining

  - id: enigma_berry
    source:
      - src/mystery_event_script.c
      - src/berry.c
    external_path: generic Mystery Event / e-Reader berry data
    emerald_distribution_status: not_confirmed_as_pokemon_battle_e_emerald_content
    policy: preserve_engine_compatibility_without_misclassifying_rs_card_data
    status: research

verification:
  source_build: pending
  localized_rom_signature_scan: pending
  jp_rom: pending
  en_rom: pending
  de_rom: pending
  fr_rom: pending
  it_rom: pending
  es_rom: pending
